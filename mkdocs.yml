site_name: NoMad's Farm
site_description: NoMad farming inventory, propagation and field notes
site_author: Ruslav Pavlov
site_url: https://nomadfarmer.tech
repo_url: https://github.com/git-rupavlov/earth-work
repo_name: git-rupavlov/earth-work

theme:
  name: material
  language: en
  logo: assets/images/nomadfarmer-logo.svg
  favicon: assets/images/nomadfarmer-logo.svg
  palette:
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Seeds: seeds/index.md
  - Seedlings: seedlings/index.md
  - Plant Database: plant-database/index.md
  - Blog:
      - Overview: blog/index.md
      - Q&A: blog/q-and-a.md
      - Discussions: blog/discussions.md
  - About: about/overview.md

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - assets/css/garden-theme.css
  - assets/css/home-minimal.css
  - assets/css/page-heroes.css
  - assets/css/metrics-app.css
  - assets/css/seeds-catalog.css
  - assets/css/top-nav.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - assets/js/metrics-app.js
  - assets/js/seeds-catalog.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
